name: setup
description: Node 22 with the npm cache, npm pinned to 11, and dependencies installed.

runs:
  using: composite
  steps:
    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: 22
        cache: npm

    # Keep CI on the npm the lockfile was generated with. Node 22 ships npm
    # 10, which disagrees with npm 11 on lockfile contents (it strips the
    # `libc` fields npm 11 writes). `npm ci` never rewrites the lockfile, so
    # this is belt-and-braces: it keeps a future divergence from surfacing
    # here as a mystery install failure. See AGENTS.md § Build system.
    # zizmor's adhoc-packages is ignored because npm can't pin itself in the
    # lockfile it writes.
    - name: Pin npm
      shell: bash
      run: npm install -g npm@11 # zizmor: ignore[adhoc-packages]

    - shell: bash
      run: npm ci
