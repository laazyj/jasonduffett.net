name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  AWS_REGION: eu-west-2

concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Keep CI on the npm the lockfile was generated with. Node 22 ships npm
      # 10, which disagrees with npm 11 on lockfile contents (it strips the
      # `libc` fields npm 11 writes). `npm ci` never rewrites the lockfile, so
      # this is belt-and-braces: it keeps a future divergence from surfacing
      # here as a mystery install failure. See AGENTS.md § Build system.
      - name: Pin npm
        run: npm install -g npm@11

      - run: npm ci

      - run: npm run verify

  cdk-diff:
    name: cdk diff
    runs-on: ubuntu-latest
    # Skip the AWS-touching job for PRs that can't assume the deploy role:
    #   - Fork PRs run under the fork's OIDC namespace.
    #   - Dependabot PRs don't receive repo Actions secrets, so the role ARN
    #     is empty and configure-aws-credentials fails.
    # The verify job still runs in both cases.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]'
    needs: verify
    permissions:
      contents: read
      id-token: write
      pull-requests: write
    env:
      ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
      GA_MEASUREMENT_ID: ${{ vars.GA_MEASUREMENT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      # Keep CI on the npm the lockfile was generated with. Node 22 ships npm
      # 10, which disagrees with npm 11 on lockfile contents (it strips the
      # `libc` fields npm 11 writes). `npm ci` never rewrites the lockfile, so
      # this is belt-and-braces: it keeps a future divergence from surfacing
      # here as a mystery install failure. See AGENTS.md § Build system.
      - name: Pin npm
        run: npm install -g npm@11

      - run: npm ci

      - uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        id: aws
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # Synthesise the cloud assembly the diff action consumes. The nx synth
      # target builds the cdk package and the site first, writing to
      # packages/cdk/cdk.out.
      - name: cdk synth
        env:
          CDK_DEFAULT_ACCOUNT: ${{ steps.aws.outputs.aws-account-id }}
          CDK_DEFAULT_REGION: ${{ env.AWS_REGION }}
        run: npm run cdk:synth

      # Posts a single sticky PR comment with a collapsible, colour-coded diff
      # per stack. Pinned to the v2.0.9 commit SHA (third-party action in an
      # AWS-credentialed job) — bump deliberately; Dependabot proposes updates.
      - name: post diff comment
        uses: corymhall/cdk-diff-action@ad67041313333f7f2bd26b33f18fb134610a971e # v2.0.9
        with:
          githubToken: ${{ secrets.GITHUB_TOKEN }}
          cdkOutDir: packages/cdk/cdk.out
          # Surface the diff only; the diff is informational and never gates the
          # PR check (matches prior behaviour).
          failOnDestructiveChanges: false
