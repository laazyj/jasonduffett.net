name: zizmor

# Static analysis of the workflows and dependabot.yml for GitHub Actions
# security issues (credential persistence, template injection, over-broad
# permissions, missing Dependabot cooldown, and so on). Runs on every PR rather
# than only on .github/** changes so it can be made a required check without
# leaving unrelated PRs waiting on a check that never starts.
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: zizmor-${{ github.ref }}
  cancel-in-progress: true

jobs:
  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Findings surface as PR annotations and fail the check, rather than as
      # SARIF in the Security tab, so this works without GitHub Advanced
      # Security. Online audits stay on (the default): impostor-commit checks
      # every SHA-pinned `uses:` really belongs to the action's repo.
      #
      # The action's default `version: latest` resolves to an image digest
      # baked into each action release, so the SHA pin below also pins zizmor.
      # New audits therefore arrive through the Dependabot actions batch, where
      # any new findings show up on that PR rather than on unrelated ones.
      - uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
          annotations: true
